<!DOCTYPE html>
<html>
<head>
<title>Be My Valentine ❤️</title>

<style>

body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#ff9a9e,#fad0c4);
    font-family:Arial;
    overflow:hidden;
}

.container{
    text-align:center;
}

h1{
    color:white;
    font-size:32px;
}

button{
    padding:15px 25px;
    font-size:18px;
    margin:15px;
    border:none;
    border-radius:10px;
    cursor:pointer;
}

#yesBtn{
    background:#ff4d6d;
    color:white;
}

#noBtn{
    background:white;
}

#yesPage{
    display:none;
    color:white;
}

.heart{
    position:absolute;
    color:red;
    animation: float 5s linear infinite;
}

@keyframes float{
    from{transform:translateY(100vh);}
    to{transform:translateY(-10vh);}
}

</style>

</head>

<body>

<div class="container" id="question">

<h1>Will you be my Valentine? ❤️</h1>

<button id="yesBtn" onclick="yesClicked()">YES 😍</button>
<button id="noBtn" onmouseover="moveButton()">NO 😜</button>

</div>

<div class="container" id="yesPage">

<h1>YAYYYY ❤️🥰</h1>
<h2>You just made Tanmay very happy 😎❤️</h2>

<img src="https://media.giphy.com/media/MDJ9IbxxvDUQM/giphy.gif" width="300">

</div>

<audio autoplay loop>
<source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mp3">
</audio>

<script>

function yesClicked(){
    document.getElementById("question").style.display="none";
    document.getElementById("yesPage").style.display="block";
}

function moveButton(){
    var btn=document.getElementById("noBtn");
    btn.style.position="absolute";
    btn.style.left=Math.random()*80+"%";
    btn.style.top=Math.random()*80+"%";
}

// Floating hearts
setInterval(function(){
    let heart=document.createElement("div");
    heart.className="heart";
    heart.innerHTML="❤️";
    heart.style.left=Math.random()*100+"vw";
    heart.style.fontSize=(Math.random()*20+10)+"px";
    document.body.appendChild(heart);

    setTimeout(()=>{heart.remove();},5000);
},300);

</script>

</body>
</html>
