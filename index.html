<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Can I Ask You Something?</title>

<style>

body{
margin:0;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#ff758c,#ff7eb3);
font-family:Arial;
text-align:center;
overflow:hidden;
}

h1{
color:white;
font-size:30px;
padding:20px;
}

button{
padding:15px 25px;
font-size:22px;
margin:10px;
border:none;
border-radius:12px;
cursor:pointer;
transition:0.3s;
}

#yesBtn{
background:#ff004f;
color:white;
}

#noBtn{
background:white;
}

#yesPage{
display:none;
color:white;
font-size:28px;
}

</style>

</head>

<body>

<div id="question">

<h1 id="mainText">Hey Sanu ❤️ My baby… will you be my Valentine?</h1>

<!-- NO comes first -->
<button id="noBtn" onclick="noClicked()">NO 😜</button>
<button id="yesBtn" onclick="yesClicked()">YES 😍</button>

</div>

<div id="yesPage">

<h1>YAYYYY ❤️🥰</h1>
<p>You just made Tanmay very happy 😎❤️</p>

<img src="https://media.giphy.com/media/MDJ9IbxxvDUQM/giphy.gif" width="250">

</div>

<script>

let yesSize = 1;
let noClicks = 0;

let messages = [
"Are you sure? 🥺",
"You better say YES 😌❤️",
"Babyyy please 😭💘",
"Don't break my heart 🥹❤️",
"Last chance 😏💕"
];

function yesClicked(){
document.getElementById("question").style.display="none";
document.getElementById("yesPage").style.display="block";
}

function noClicked(){

noClicks++;

if(noClicks <= messages.length){
document.getElementById("mainText").innerHTML = messages[noClicks-1];
}

yesSize += 0.3;
document.getElementById("yesBtn").style.transform =
"scale("+yesSize+")";

let noBtn = document.getElementById("noBtn");

if(noClicks < 3){
noBtn.style.position="absolute";
noBtn.style.left=Math.random()*80+"%";
noBtn.style.top=Math.random()*80+"%";
}

if(noClicks >= 3){
noBtn.style.position="relative";
noBtn.style.marginLeft="-40px"; // moves close to YES
}

if(noClicks >=5){
noBtn.style.display="none"; // disappears 😈
}

}

</script>

</body>
</html>
